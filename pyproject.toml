[project]
name = "db-analyzer"
version = "0.1.0"
description = "Conversational read-only database analyzer agent (PostgreSQL first)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "deepagents~=0.7.23",
    "fastapi>=0.143.0",
    "langchain>=1.4.4",
    "langchain-openai>=1.7.0",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pglast>=8.5",
    "psycopg[binary]>=3.2",
    "pydantic>=2.14.0",
    "rich>=15.0.0",
    "sqlalchemy>=2.1.4",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
dbx = "db_analyzer.cli:app"

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.33",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/db_analyzer"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Docs keep compact, hand-formatted code sketches.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs the Docker Postgres fixtures (`make db-up`)",
    "spike: throwaway experiment, run by hand (`uv run pytest -m spike -s`)",
]
