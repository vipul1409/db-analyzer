# Postgres fixtures for integration tests. Host port = 5400 + major version.
# pg14 exists only to test that unsupported versions are refused.
x-pg: &pg
  volumes:
    - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    - ../../docs/setup:/setup:ro
  environment:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: app
  command:
    - postgres
    - -c
    - shared_preload_libraries=pg_stat_statements
    - -c
    - pg_stat_statements.track=all
    - -c
    - track_io_timing=on
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d app"]
    interval: 2s
    timeout: 3s
    retries: 30

x-standby: &standby
  profiles: ["standby"]
  volumes:
    - ./postgres/standby.sh:/standby.sh:ro
  entrypoint: ["/standby.sh"]
  command:
    - -c
    - shared_preload_libraries=pg_stat_statements
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
    interval: 2s
    timeout: 3s
    retries: 60

services:
  pg14:
    <<: *pg
    build: { context: ./postgres, args: { PG_MAJOR: "14" } }
    image: db-analyzer-fixture-pg:14
    ports: ["5414:5432"]
  pg15:
    <<: *pg
    build: { context: ./postgres, args: { PG_MAJOR: "15" } }
    image: db-analyzer-fixture-pg:15
    ports: ["5415:5432"]
  pg16:
    <<: *pg
    build: { context: ./postgres, args: { PG_MAJOR: "16" } }
    image: db-analyzer-fixture-pg:16
    ports: ["5416:5432"]
  pg17:
    <<: *pg
    build: { context: ./postgres, args: { PG_MAJOR: "17" } }
    image: db-analyzer-fixture-pg:17
    ports: ["5417:5432"]
  pg18:
    <<: *pg
    build: { context: ./postgres, args: { PG_MAJOR: "18" } }
    image: db-analyzer-fixture-pg:18
    ports: ["5418:5432"]

  # Hot standbys for the generic-plan spike (#4): `make db-up PG="pg15 pg15-standby"`.
  # Host port = 5500 + major version.
  pg15-standby:
    <<: *standby
    image: db-analyzer-fixture-pg:15
    environment: { PRIMARY: pg15 }
    depends_on: { pg15: { condition: service_healthy } }
    ports: ["5515:5432"]
  pg16-standby:
    <<: *standby
    image: db-analyzer-fixture-pg:16
    environment: { PRIMARY: pg16 }
    depends_on: { pg16: { condition: service_healthy } }
    ports: ["5516:5432"]
