name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  # Weekly sweep of the full history, in case something slipped in earlier.
  schedule:
    - cron: "0 6 * * 1"

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the scan covers every commit, not just the tip.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only needed for GitHub *organization* accounts; harmless (unset) on personal repos.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
