name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: make check

  integration:
    name: Integration (PostgreSQL ${{ matrix.pg }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: ["15", "16", "17", "18"]
    env:
      DBX_TEST_PG_VERSIONS: ${{ matrix.pg }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: make db-up PG=pg${{ matrix.pg }}
      - run: make test-integration
      - if: always()
        run: make db-down
