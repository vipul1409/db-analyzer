name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: make check

  api-client:
    name: API contract and web client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --locked
      - run: npm --prefix web ci
      - run: make api-client
      - name: Committed OpenAPI spec and client match the API
        run: git diff --exit-code -- web/openapi.json web/src/api/schema.d.ts
      - run: make web-check

  integration:
    name: Integration (PostgreSQL ${{ matrix.pg }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Narrowed to PG 17 during development; restore "15", "16", "18" before release.
        pg: ["17"]
    env:
      DBX_TEST_PG_VERSIONS: ${{ matrix.pg }}
      # The PG 15 job also starts PG 14 to test that unsupported versions are refused.
      DBX_TEST_UNSUPPORTED_PG_VERSIONS: ${{ matrix.pg == '15' && '14' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: make db-up PG="pg${{ matrix.pg }} ${{ matrix.pg == '15' && 'pg14' || '' }}"
      - run: make test-integration
      - if: always()
        run: make db-down
