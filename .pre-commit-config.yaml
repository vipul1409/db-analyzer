repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: gitleaks
        name: gitleaks
        # Scan only the staged changes (uses .gitleaks.toml). Needs gitleaks on PATH:
        # `brew install gitleaks`. CI runs the full-history scan separately.
        entry: gitleaks git --pre-commit --staged --redact --no-banner
        language: system
        pass_filenames: false
